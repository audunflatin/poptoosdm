<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools – Prisregulering</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512x512.png">

  <link rel="stylesheet" href="/static/styles.css?v=26">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
  <style>
    .btn-primary {
      background: #ff5959; color: white; border: none; border-radius: 8px;
      padding: 0.65rem 2rem; font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: inherit; margin-top: 1.75rem; transition: background 0.15s;
    }
    .btn-primary:hover { background: #e04444; }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }

    .pct-row {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      margin-top: 0;
    }
    .pct-row > div { flex: 1; max-width: 220px; }
    .factor-display {
      padding-bottom: 0.7rem;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
    }
    .factor-display span {
      color: rgba(255,255,255,0.85);
      font-weight: 600;
    }
  </style>
</head>
<body>

<nav class="sidebar">
  <a href="/" class="sidebar-brand">
    <svg width="170" height="34" viewBox="0 0 220 44" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="22" r="9" fill="#ff5959"/>
      <line x1="23" y1="22" x2="35" y2="22" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-dasharray="3 2"/>
      <circle cx="44" cy="22" r="7" fill="none" stroke="white" stroke-width="2.5"/>
      <text x="60" y="29" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-weight="800" font-size="21" fill="white"><tspan fill="#ff5959">OSDM</tspan>Tools</text>
    </svg>
  </a>
  <div class="sidebar-nav">
    <a href="/price-adjust" class="sidebar-link active" data-i18n="nav_price_adjust">Prisregulering</a>
    <a href="/" class="sidebar-link" data-i18n="nav_generate">Priser fra avstandsfil</a>
    <a href="/osdmtoexcel" class="sidebar-link" data-i18n="nav_osdm_excel">OSDM → Excel</a>
    <a href="/fare-discount" class="sidebar-link" data-i18n="nav_fare_discount">Legg til rabatt i OSDM</a>
    <a href="/fix-osdm" class="sidebar-link" data-i18n="nav_fix_osdm">Rydd opp i OSDM</a>
    <a href="/osdm-editor" class="sidebar-link" style="display:flex;align-items:center;justify-content:space-between;"><span data-i18n="nav_osdm_editor">OSDM-editor</span><span class="beta-tag">BETA</span></a>
    <a href="/stasjonssok" class="sidebar-link" data-i18n="nav_station_lookup">Stasjonssøk</a>
    <a href="/kontakt" class="sidebar-link" data-i18n="nav_contact">Kontakt</a>
    <a href="/min-konto" class="sidebar-link" data-i18n="nav_my_account">Endre passord</a>
    <a id="adminLink" href="/admin/users" class="sidebar-link" data-i18n="nav_admin" style="display:none;">Admin</a>
    <div id="adminSubmenu" style="display:none; flex-direction:column; gap:1px;">
      <a href="/admin/users" class="sidebar-sublink" style="display:flex; align-items:center; justify-content:space-between;">
        <span data-i18n="nav_admin_users">Brukere</span>
        <span id="sidebarPendingBadge" style="display:none; background:var(--coral); color:white; border-radius:9999px; font-size:0.65rem; font-weight:700; padding:1px 7px; line-height:1.6;"></span>
      </a>
      <a href="/admin/log" class="sidebar-sublink" data-i18n="nav_admin_log">Logg</a>
      <a href="/admin/presentation" class="sidebar-sublink" data-i18n="nav_admin_presentation">Presentasjon</a>
    </div>
  </div>
</nav>

<header class="app-header">
  <span class="lang-selector">
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()"><!-- filled by JS --></button>
    <span style="width:4px;display:inline-block;"></span>
    <button class="lang-btn" data-lang="no" onclick="setLanguage('no')" title="Norsk">🇳🇴</button>
    <button class="lang-btn" data-lang="en" onclick="setLanguage('en')" title="English">🇬🇧</button>
    <button class="lang-btn" data-lang="de" onclick="setLanguage('de')" title="Deutsch">🇩🇪</button>
    <button class="lang-btn" data-lang="sv" onclick="setLanguage('sv')" title="Svenska">🇸🇪</button>
    <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')" title="Français">🇫🇷</button>
    <span class="lang-sep">|</span>
    <a href="/logout" class="logout-button" data-i18n="logout">Logg ut</a>
  </span>
</header>

<div class="container">
  <section class="panel">
    <h2 data-i18n="heading_price_adjust">Prisregulering</h2>
    <p style="color:var(--text-muted); margin-bottom:1.75rem;" data-i18n="price_adjust_desc">
      Last opp en OSDM-fil og juster prisene med en fast prosentsats.
    </p>

    <label for="osdmFile" data-i18n="label_osdm_file">OSDM JSON-fil</label>
    <input type="file" id="osdmFile" accept=".json" onchange="validateOsdmFile()" />
    <div id="osdmProgress" style="display:none; margin-top:0.75rem;">
      <div style="height:6px; background:var(--spinner-ring); border-radius:3px; overflow:hidden;">
        <div class="progress-fill" style="height:100%; background:#ff5959; border-radius:3px; transition:width 0.5s ease; width:0%;"></div>
      </div>
      <div style="display:flex; gap:0.75rem; align-items:center; margin-top:0.4rem; font-size:0.8rem; color:var(--text-muted);">
        <span class="spinner-sm"></span>
        <span class="progress-pct">0%</span>
        <span class="progress-stage"></span>
      </div>
    </div>
    <div id="osdmSummary"></div>

    <div class="pct-row">
      <div>
        <label for="adjustPct" data-i18n="label_adjust_pct">Prisendring (%)</label>
        <input type="number" id="adjustPct" step="0.1" data-i18n-placeholder="placeholder_adjust_pct" />
      </div>
      <div class="factor-display" id="factorDisplay" style="display:none;">
        Faktor: <span id="factorVal"></span>
      </div>
    </div>

    <div id="deliveryFields" style="display:none;">
      <hr class="step-sep">

      <label data-i18n="label_delivery_id">DeliveryId</label>
      <input id="deliveryId" type="text" required />

      <label data-i18n="label_previous_delivery_id">Previous DeliveryId <span style="opacity:0.5;font-weight:normal;">(valgfri)</span></label>
      <input id="previousDeliveryId" type="text" data-i18n-placeholder="placeholder_previous_delivery_id" />

      <label data-i18n="label_environment">Miljø</label>
      <select id="environment">
        <option value="prod" data-i18n="opt_production">Produksjon</option>
        <option value="test" data-i18n="opt_test">Test</option>
      </select>

      <label data-i18n="label_optional_delivery">Optional delivery</label>
      <select id="optionalDelivery">
        <option value="false" selected data-i18n="opt_no">Nei</option>
        <option value="true" data-i18n="opt_yes">Ja</option>
      </select>

      <label data-i18n="label_valid_from">Gyldig fra</label>
      <input id="validFrom" type="date" required />

      <label data-i18n="label_valid_to">Gyldig til</label>
      <input id="validTo" type="date" required />

      <div id="statusMsg" style="display:none; margin-top:1.25rem; padding:0.65rem 1rem; border-radius:4px; font-size:0.9rem;"></div>

      <button class="btn-primary" id="adjustBtn" data-i18n="btn_adjust">Juster og last ned</button>
      <div id="spinnerAdjust" class="spinner"></div>
    </div>
  </section>
</div>

<script src="/static/i18n.js?v=55"></script>
<script>
  if (typeof window.IS_ADMIN !== "undefined" && window.IS_ADMIN) {
    document.getElementById("adminLink").style.display = "";
    document.getElementById("adminSubmenu").style.display = "flex";
  }
</script>
<script src="/static/priceAdjust.js?v=10"></script>
</body>
</html>
